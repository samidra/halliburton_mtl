<div class="container-fluid">
    <div class="row p-4">
        <div class="col-5 ">
            <h2>TestTrack Help Center</h2>
            <form autocomplete="off" (ngSubmit)="onSubmit()" [formGroup]="helpForm" class="help-form">

                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input id="subject" formControlName="subject" placeholder="Subject " type="text"
                        class="form-control" required [ngStyle]="{
            'border-color': helpForm.get('subject')?.invalid && helpForm.get('subject')?.touched ? 'red' : ''
        }" />

                    <div *ngIf="helpForm.get('subject')?.touched">
                        <div *ngIf="helpForm.get('subject')?.invalid && helpForm.get('subject')?.hasError('required')"
                            class="text-danger">
                            Subject is required.
                        </div>
                        <div *ngIf="helpForm.get('subject')?.invalid && helpForm.get('subject')?.hasError('minlength')"
                            class="text-danger">
                            Subject must be at least 3 characters long.
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" formControlName="message" placeholder="Enter your message here..."
                        class="form-control" required class="form-control" required [ngStyle]="{
            'border-color': helpForm.get('message')?.invalid && helpForm.get('message')?.touched ? 'red' : ''
        }"></textarea>
                    <div *ngIf="helpForm.get('message')?.touched">
                        <div *ngIf="helpForm.get('message')?.invalid && helpForm.get('message')?.hasError('required')"
                            class="text-danger">
                            Message is required.
                        </div>
                        <div *ngIf="helpForm.get('message')?.invalid && helpForm.get('message')?.hasError('minlength')"
                            class="text-danger">
                            Message must be at least 10 characters long.
                        </div>
                    </div>
                </div>

                @if (Is_spinner) {
                <button type="button" class="save_button" style="display: flex; justify-content: center;">
                    <div class="spinner"></div>
                </button>
                }@else{
                <button type="submit" class="save_button">Send Email</button>
                }
            </form>
        </div>
    </div>

</div>
